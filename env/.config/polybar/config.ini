[colors]
; === fl4my cold palette ===
bg           = #0d1117
fg           = #cdd9e5
accent       = #58a6ff
secondary    = #ff7b72
dim          = #161b22
comment      = #3d444d
green        = #3fb950
amber        = #ffa657
purple       = #d2a8ff

[bar/main]
monitor               =
width                 = 100%
height                = 40
offset-x              = 0
offset-y              = 0
radius                = 0
fixed-center          = true
bottom                = false
background            = ${colors.bg}
foreground            = ${colors.fg}
line-size             = 2
line-color            = ${colors.accent}
border-size           = 0
padding-left          = 2
padding-right         = 2
module-margin-left    = 0
module-margin-right   = 0
font-0                = JetBrainsMono Nerd Font:style=SemiBold:pixelsize=18;6
font-1                = JetBrainsMono Nerd Font:style=SemiBold:pixelsize=18;6
font-2                = JetBrainsMono Nerd Font:style=SemiBold:pixelsize=18;6
modules-left          = i3
modules-center        = date
modules-right         = tun0 eth disk cpu memory tray
tray-position         = right
tray-padding          = 4
tray-maxsize          = 20
tray-background       = ${colors.bg}
separator             = %{F#3d444d}│%{F-}
wm-restack            = i3
override-redirect     = false
enable-ipc            = true
cursor-click          = pointer
cursor-scroll         = ns-resize

[module/i3]
type                     = internal/i3
format                   = <label-state> <label-mode>
index-sort               = true
wrapping-scroll          = false
label-focused            = %index%
label-focused-foreground = ${colors.accent}
label-focused-background = ${colors.dim}
label-focused-underline  = ${colors.accent}
label-focused-padding    = 1
label-unfocused          = %index%
label-unfocused-foreground = ${colors.comment}
label-unfocused-padding  = 1
label-urgent             = %index%
label-urgent-foreground  = ${colors.secondary}
label-urgent-padding     = 1

[module/date]
type                  = internal/date
interval              = 1
date                  = %a %d %b
time                  = %H:%M:%S
format-prefix         = "󰥔 "
format-prefix-foreground = ${colors.accent}
label                 = %date%  %time%
label-foreground      = ${colors.fg}

; VPN tun0
[module/tun0]
type                  = custom/script
exec                  = ip addr show tun0 2>/dev/null | awk '/inet / {print $2}' | cut -d/ -f1 || echo "down"
interval              = 10
format-prefix         = "󰖂 "
format-prefix-foreground = ${colors.green}
label                 = %output%
label-foreground      = ${colors.fg}

; Ethernet / first active IP
[module/eth]
type                  = custom/script
exec                  = ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="src") print $(i+1)}' || echo "down"
interval              = 10
format-prefix         = "󰈀 "
format-prefix-foreground = ${colors.accent}
label                 = %output%
label-foreground      = ${colors.fg}

; Disk
[module/disk]
type                  = internal/fs
mount-0               = /
interval              = 30
format-mounted-prefix         = "󰋊 "
format-mounted-prefix-foreground = ${colors.comment}
label-mounted         = %free%
label-mounted-foreground = ${colors.fg}

; CPU
[module/cpu]
type                  = internal/cpu
interval              = 2
format-prefix         = "󰍛 "
format-prefix-foreground = ${colors.amber}
label                 = %percentage%%
label-foreground      = ${colors.fg}

; Memory
[module/memory]
type                  = internal/memory
interval              = 2
format-prefix         = "󰘚 "
format-prefix-foreground = ${colors.purple}
label                 = %used% / %free%
label-foreground      = ${colors.fg}
format-warn-prefix    = "󰘚 "
format-warn-prefix-foreground = ${colors.secondary}
warn-percentage       = 90

[module/tray]
type                  = internal/tray
icon-size             = 28
icon-padding          = 6

[settings]
screenchange-reload   = true
pseudo-transparency   = false
